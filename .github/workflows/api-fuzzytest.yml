name: api-fuzzytest

# Schemathesis DAST fuzzy test run against a fresh app instance. Reuses the same
# scripts/run_api_fuzzytest.sh as `just api-fuzzytest`: the container applies
# migrations, mints an API key, boots uvicorn and runs the full coverage,
# fuzzing and stateful phases against a throwaway database.
# A random Hypothesis seed is used per run, so each run explores new input
# space; any failure is a real bug (Schemathesis shrinks to a minimal repro).
#
# postgres + rabbitmq come from Docker Hub via job `services`; the test image
# is built with Buildx so it can pull the project's base images (the compose
# daemon cannot reach the private base registry from CI).
#
# Triggered either manually (workflow_dispatch, once the file is on the default
# branch) or on a PR by applying the `run-api-fuzzytest` label (pull_request
# labeled), so the fuzzy tests can be run before merge on demand.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  api-fuzzytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-api-fuzzytest')

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: argus
          RABBITMQ_DEFAULT_PASS: argus
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          target: test
          load: true
          tags: argus-fuzzy-test:latest

      - name: Run API fuzzy tests
        # Runs migrations, mints a key, starts uvicorn and runs schemathesis
        # against the throwaway DB (see scripts/run_api_fuzzytest.sh). The image
        # already bakes the app + generated gRPC stubs; only ./scripts is
        # mounted. --network host reaches the job services on localhost.
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e RABBITMQ_HOST=localhost \
            -v "${{ github.workspace }}/scripts:/scripts:ro" \
            argus-fuzzy-test:latest sh /scripts/run_api_fuzzytest.sh

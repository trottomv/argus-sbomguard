name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: app
            file: app/Dockerfile
            target: remote
            image: ghcr.io/${{ github.repository }}
            description: Open-source SBOM-based vulnerability management platform.
          - name: backup
            context: .
            file: backup/Dockerfile
            image: ghcr.io/${{ github.repository }}-backup
            description: PostgreSQL backup/restore tooling image (pg_dump + openssl).
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with cosign
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${IMAGE}"

      - name: Verify image signature
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Docs — Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (e.g. v0.1.0)
        required: true
      alias:
        description: Alias (optional)
        required: false

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "app/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        working-directory: app
        run: |
          uv venv
          uv sync --no-default-groups --only-group docs

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Deploy docs (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source app/.venv/bin/activate
          VERSION=${GITHUB_REF#refs/tags/}
          mike deploy --push "$VERSION"

      - name: Deploy docs (main branch — latest)
        if: github.ref == 'refs/heads/main'
        run: |
          source app/.venv/bin/activate
          mike deploy --push --update-aliases main latest
          mike set-default --push latest

      - name: Deploy docs (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          source app/.venv/bin/activate
          ALIAS="${{ inputs.alias }}"
          if [ -n "$ALIAS" ]; then
            mike deploy --push --update-aliases "${{ inputs.version }}" "$ALIAS"
          else
            mike deploy --push "${{ inputs.version }}"
          fi

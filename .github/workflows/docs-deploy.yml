name: Docs — Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (e.g. v0.1.0)
        required: true
      alias:
        description: Alias (optional)
        required: false

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          pip install \
            mkdocs~=1.7.0 \
            mkdocs-material~=9.6.0 \
            'mkdocstrings[python]~=0.29.0' \
            mike~=2.2.0

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Deploy docs (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mike deploy --push --rebase "$VERSION"

      - name: Deploy docs (main branch — latest)
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push --rebase --update-aliases latest latest
          mike set-default --push latest

      - name: Deploy docs (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ALIAS="${{ inputs.alias }}"
          if [ -n "$ALIAS" ]; then
            mike deploy --push --rebase --update-aliases "${{ inputs.version }}" "$ALIAS"
          else
            mike deploy --push --rebase "${{ inputs.version }}"
          fi

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: argus
          RABBITMQ_DEFAULT_PASS: argus
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "app/requirements/*.txt"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: app
        run: |
          uv venv
          uv pip install -r requirements/dev.txt

      - name: Generate gRPC stubs
        working-directory: app
        run: |
          mkdir -p protos/generated
          touch protos/generated/__init__.py
          uv run --no-sync python -m grpc_tools.protoc \
            -Iprotos \
            --python_out=protos/generated \
            --grpc_python_out=protos/generated \
            protos/sbom.proto

      - name: Run tests
        working-directory: app
        env:
          PYTHONPATH: .:protos/generated
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: argus
          RABBITMQ_PASSWORD: argus
        run: uv run --no-sync pytest -v

name: tests

# Runs the pytest suite against a fresh app instance. Mirrors the
# api-fuzzytest workflow: postgres + rabbitmq come from Docker Hub via job
# `services`, the test image is built with Buildx (the compose daemon cannot
# reach the private base registry from CI) and pytest runs inside it. The same
# image and setup back `just test-stack`, so CI and the local test stack stay
# in lockstep.
# The test image bakes the app, the generated gRPC stubs and dev deps; its CMD
# runs `pytest -v --cov=. --cov-report=term-missing`. The entrypoint execs that
# command as-is (migrations are only run for the uvicorn CMD; conftest applies
# them to the throwaway test database).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: argus
          RABBITMQ_DEFAULT_PASS: argus
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          target: test
          load: true
          tags: argus-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        # --network host reaches the job services on localhost. Env mirrors the
        # job services credentials explicitly (no reliance on config.py defaults)
        # so CI matches `just test-stack`. ./docs is mounted read-only because
        # test_openapi.py resolves ../docs from /app/tests (the image bakes only
        # /app); dropping the mount fails the OpenAPI snapshot test.
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=argus \
            -e POSTGRES_PASSWORD=argus \
            -e POSTGRES_DB=argus \
            -e RABBITMQ_HOST=localhost \
            -e RABBITMQ_USER=argus \
            -e RABBITMQ_PASSWORD=argus \
            -v "${{ github.workspace }}/docs:/docs:ro" \
            argus-test:latest

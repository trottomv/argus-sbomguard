[project]
name = "argus-sbomguard"
version = "0.0.2-beta"
description = "Centralized SBOM management platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.52.0",
    "jinja2~=3.1.0",
    "aiofiles~=25.1.0",
    "python-multipart~=0.0.32",
    "sqlalchemy[asyncio]~=2.0.0",
    "asyncpg~=0.31.0",
    "alembic~=1.19.0",
    "celery~=5.6.0",
    "pydantic~=2.13.0",
    "pydantic-settings~=2.15.0",
    "httpx~=0.28.0",
    "grpcio~=1.83.0",
    "grpcio-tools~=1.83.0",
    "cyclonedx-python-lib~=11.11.0",
    "packageurl-python~=0.17.0",
    "aiosmtplib~=5.1.0",
    "itsdangerous~=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.0",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-httpx~=0.36.0",
    "ruff~=0.16.0",
    "bandit~=1.9.0",
    "pip-audit~=2.10.0",
    "pre-commit~=4.6.0",
]
[dependency-groups]
docs = [
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.6.0",
    "mkdocstrings[python]~=0.29.0",
    "mike~=2.2.0",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*", "app/static/*"]
core = "sysmon"


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["protos/generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff specific
]
ignore = ["E501", "B008", "N818"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".ruff_cache"]

[tool.pip-audit]
require-hashes = true
disable-pip = true
requirement = "requirements/remote.txt"

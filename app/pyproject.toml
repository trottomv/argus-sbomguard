[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-sbomguard"
dynamic = ["version"]
description = "Centralized SBOM management platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.52.0",
    "jinja2~=3.1.0",
    "aiofiles~=25.1.0",
    "python-multipart~=0.0.32",
    "sqlalchemy[asyncio]~=2.0.0",
    "asyncpg~=0.31.0",
    "alembic~=1.19.0",
    "celery~=5.6.0",
    "pydantic~=2.13.0",
    "pydantic-settings~=2.15.0",
    "httpx~=0.28.0",
    "grpcio~=1.83.0",
    "grpcio-tools~=1.83.0",
    "cyclonedx-python-lib~=11.11.0",
    "packageurl-python~=0.17.0",
    "aiosmtplib~=5.1.0",
    "itsdangerous~=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.0",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-httpx~=0.36.0",
    "ruff~=0.16.0",
    "bandit~=1.9.0",
    "pip-audit~=2.10.0",
    "pre-commit~=4.6.0",
]
[dependency-groups]
docs = [
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.6.0",
    "mkdocstrings[python]~=0.29.0",
    "mike~=2.2.0",
]

[tool.hatch.version]
path = "VERSION.md"

[tool.coverage.run]
source = ["."]
omit = [
    "*/templates/*",
    "*/static/*",
    "*/protos/generated/*",
    "*/node_modules/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/.docs-venv/*",
    "*/cov_annotate/*",
    "*/entrypoint.py",
]
core = "sysmon"


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["protos/generated"]

[tool.ruff.lint]
ignore = [
    "B008",     # function-call-in-default-argument: allow Depends()/Header() defaults in FastAPI
    "E501",     # line-too-long: allow long lines (URLs, string literals)
    "N818",     # error-suffix-on-exception-name: exception names may omit the "Error" suffix
    "RUF201",   # rule-codes-in-selectors: keep alphanumeric codes in select/ignore lists
]
mccabe.max-complexity = 12
preview = true
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # McCabe cyclomatic complexity
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "RUF",  # ruff specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".ruff_cache"]

[tool.pip-audit]
require-hashes = true
disable-pip = true
requirement = "requirements/remote.txt"

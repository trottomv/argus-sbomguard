<form hx-patch="/projects/{{ project.id }}/name" hx-target="#project-name" hx-swap="innerHTML"
      class="flex items-center gap-2">
    <input type="text" name="name" value="{{ project.name }}" class="input input-sm input-bordered text-2xl font-bold w-96" autofocus>
    <button type="submit" class="btn btn-ghost btn-sm text-ctp-green">
        <svg class="w-4 h-4" aria-hidden="true" focusable="false"><use href="#icon-check"></use></svg>
    </button>
    <button type="button" class="btn btn-ghost btn-sm"
            hx-get="/projects/{{ project.id }}/cancel-edit-name"
            hx-target="#project-name" hx-swap="innerHTML">
        <svg class="w-4 h-4" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg>
    </button>
</form>

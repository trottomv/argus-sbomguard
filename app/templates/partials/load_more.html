{% if items and has_more %}
    <div class="text-center py-4">
        <button class="btn btn-outline btn-sm w-full max-w-md"
                hx-get="{{ load_more_url }}{% if offset is defined and offset is not none %}&offset={{ offset + per_page }}{% else %}&page={{ page + 1 }}{% endif %}"
                hx-target="#{{ target }}-tbody"
                hx-swap="beforeend"
                hx-trigger="click once"
                hx-indicator="#load-more-indicator-{{ target }}">
            {% if label %}{{ label }}{% else %}Load more{% endif %}
            ({% if offset is defined and offset is not none %}{{ total - (offset + per_page) }}{% else %}{{ total - (per_page * page) }}{% endif %} remaining)
            <span id="load-more-indicator-{{ target }}"
                  class="htmx-indicator loading loading-spinner loading-sm"></span>
        </button>
    </div>
{% endif %}

{% for project in items %}
<div class="rounded-xl bg-ctp-mantle border border-ctp-surface0 p-5 card-hover relative group">
    <a href="/projects/{{ project.id }}" class="block">
        <h2 class="text-lg font-bold text-ctp-text">{{ project.name }}</h2>
        {% if project.description %}
        <p class="text-sm opacity-70">{{ project.description }}</p>
        {% endif %}
        <div class="flex items-center gap-2 mt-2 text-xs opacity-50">
            {% if project.repo_url %}
            <span>{{ project.repo_url }}</span>
            {% endif %}
            <span>{{ project.created_at | format_dt('%Y-%m-%d', '') }}</span>
        </div>
    </a>
    <button class="btn btn-ghost btn-sm text-error absolute top-2 right-2 opacity-0 group-hover:opacity-100"
            @click.stop="delId='{{ project.id }}'; delName='{{ project.name }}'; delete_modal.showModal()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </button>
    <button class="btn btn-ghost btn-sm absolute top-2 right-10 opacity-0 group-hover:opacity-100"
            @click.stop="editId='{{ project.id }}'; name='{{ project.name }}'; description='{{ project.description or '' }}'; repo_url='{{ project.repo_url or '' }}'; platform='{{ project.platform or '' }}'; my_modal_1.showModal()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    </button>
</div>
{% endfor %}

<div id="load-more-projects" hx-swap-oob="true">
{% if items and has_more %}
<div class="text-center col-span-full">
    <button class="btn btn-outline"
            hx-get="/projects?page={{ page + 1 }}&per_page={{ per_page }}"
            hx-target="#project-cards"
            hx-swap="beforeend"
            hx-trigger="click once">
        Load more ({{ total - (per_page * page) }} remaining)
    </button>
</div>
{% endif %}
</div>

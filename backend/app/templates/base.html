<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Argus SBOM Guard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="/static/css/dist.css">
</head>
<body class="bg-ctp-base text-ctp-text antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside class="hidden lg:flex lg:flex-col w-64 bg-ctp-mantle border-r border-ctp-surface0">
            <div class="p-5 border-b border-ctp-surface0">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-indigo-500/20">
                        A
                    </div>
                    <div>
                        <h1 class="text-base font-bold tracking-tight text-ctp-text">Argus</h1>
                        <p class="text-xs text-ctp-overlay0">SBOM Guard</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-3 space-y-1">
                <a href="/" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/projects" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    Projects
                </a>
                <a href="/vulnerabilities" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                    Vulnerabilities
                </a>
                <a href="/settings" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Settings
                </a>
            </nav>
            <div class="p-4 border-t border-ctp-surface0">
                <div class="flex items-center gap-2 text-xs text-ctp-overlay0">
                    <span class="inline-block w-2 h-2 rounded-full bg-ctp-green shadow-sm shadow-ctp-green/30"></span>
                    v0.1.0 &middot; AGPL v3
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-ctp-mantle/80 backdrop-blur-sm border-b border-ctp-surface0">
                <div class="flex items-center justify-between px-4 lg:px-6 h-14">
                    <div class="flex items-center gap-3">
                        <button type="button" class="lg:hidden p-2 rounded-lg text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0 transition-colors" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                        </button>
                        <div class="text-sm text-ctp-subtext0">
                            {% block breadcrumb %}<span class="text-ctp-text font-medium">Dashboard</span>{% endblock %}
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 lg:p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div id="mobile-menu" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="document.getElementById('mobile-menu').classList.add('hidden')"></div>
        <aside class="absolute left-0 top-0 bottom-0 w-64 bg-ctp-mantle border-r border-ctp-surface0 p-4">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs">A</div>
                    <span class="font-bold">Argus</span>
                </div>
                <button onclick="document.getElementById('mobile-menu').classList.add('hidden')" class="p-1 rounded-lg hover:bg-ctp-surface0 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <nav class="space-y-1">
                <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0">Dashboard</a>
                <a href="/projects" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0">Projects</a>
                <a href="/vulnerabilities" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0">Vulnerabilities</a>
                <a href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-ctp-subtext0 hover:text-ctp-text hover:bg-ctp-surface0">Settings</a>
            </nav>
        </aside>
    </div>
</body>
</html>

include:
  - docker-compose/postgresql.yml
  - docker-compose/rabbitmq.yml
  - docker-compose/mailpit.yml
  - docker-compose/app.yml
  - docker-compose/backup.yml
  - docker-compose/caddy.yml
  - docker-compose/otel.yml
  - docker-compose/jaeger.yml

services:
  postgres:
    ports:
      - "5432:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        UV_VERSION: ${UV_VERSION:-~=0.12.0}
        PIP_VERSION: ${PIP_VERSION:-~=26.2.0}
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - 8000:8000
      - 50051:50051
    user: "0:0"
    volumes:
      - ./app:/app

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        UV_VERSION: ${UV_VERSION:-~=0.12.0}
        PIP_VERSION: ${PIP_VERSION:-~=26.2.0}
    env_file:
      - .env
    user: "0:0"
    volumes:
      - ./app:/app

  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        UV_VERSION: ${UV_VERSION:-~=0.12.0}
        PIP_VERSION: ${PIP_VERSION:-~=26.2.0}
    env_file:
      - .env
    user: "0:0"
    volumes:
      - ./app:/app

  mailpit:
    ports:
      - 1025:1025
      - 8025:8025

include:
  - docker-compose/postgresql.yml
  - docker-compose/rabbitmq.yml
  - docker-compose/app.yml
  - docker-compose/backup.yml
  - docker-compose/caddy.yml
  - docker-compose/otel.yml
  # Jaeger (optional, behind the `jaeger` profile: COMPOSE_PROFILES=jaeger or
  # --profile jaeger). Works in remote too, but host ports 16686/4318 are
  # published only by the local dev override, so on a remote host the dashboard
  # stays internal to the compose network. Still not recommended on production
  # hosts (unauthenticated UI, in-memory traces): prefer an external OTLP
  # backend (OTEL_FORWARD_ENDPOINT) there.
  - docker-compose/jaeger.yml

services:
  backup:
    image: ghcr.io/trottomv/argus-sbomguard-backup:${APP_VERSION:-0.0.9-beta}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups

  app:
    image: ghcr.io/trottomv/argus-sbomguard:${APP_VERSION:-0.0.9-beta}
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-512M}
          cpus: ${APP_CPU_LIMIT:-1.0}
    env_file:
      - .env
    restart: unless-stopped

  worker:
    image: ghcr.io/trottomv/argus-sbomguard:${APP_VERSION:-0.0.9-beta}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-512M}
          cpus: ${WORKER_CPU_LIMIT:-1.0}
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    image: ghcr.io/trottomv/argus-sbomguard:${APP_VERSION:-0.0.9-beta}
    deploy:
      resources:
        limits:
          memory: ${SCHEDULER_MEM_LIMIT:-128M}
          cpus: ${SCHEDULER_CPU_LIMIT:-0.5}
    env_file:
      - .env
    restart: unless-stopped

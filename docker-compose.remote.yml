include:
  - docker-compose/postgresql.yml
  - docker-compose/rabbitmq.yml
  - docker-compose/app.yml
  - docker-compose/caddy.yml

services:
  app:
    env_file:
      - .env
    restart: unless-stopped
    build:
      target: remote
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-512M}
          cpus: ${APP_CPU_LIMIT:-1.0}

  worker:
    env_file:
      - .env
    restart: unless-stopped
    build:
      target: remote
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-512M}
          cpus: ${WORKER_CPU_LIMIT:-1.0}

  scheduler:
    env_file:
      - .env
    restart: unless-stopped
    build:
      target: remote
    deploy:
      resources:
        limits:
          memory: ${SCHEDULER_MEM_LIMIT:-128M}
          cpus: ${SCHEDULER_CPU_LIMIT:-0.5}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-argus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-argus}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/__init__.py:/app/app/__init__.py
      - ./backend/app/main.py:/app/app/main.py
      - ./backend/app/config.py:/app/app/config.py
      - ./backend/app/celery_app.py:/app/app/celery_app.py
      - ./backend/app/database.py:/app/app/database.py
      - ./backend/app/api:/app/app/api
      - ./backend/app/services:/app/app/services
      - ./backend/app/models:/app/app/models
      - ./backend/app/templates:/app/app/templates
      - ./backend/app/static/css/app.css:/app/app/static/css/app.css
      - ./backend/migrations:/app/migrations
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend/app/celery_app.py:/app/app/celery_app.py
      - ./backend/app/config.py:/app/app/config.py
      - ./backend/app/database.py:/app/app/database.py
      - ./backend/app/services:/app/app/services
      - ./backend/app/models:/app/app/models
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./backend/app/celery_app.py:/app/app/celery_app.py
      - ./backend/app/config.py:/app/app/config.py
    env_file:
      - .env
    depends_on:
      - rabbitmq

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - postgres

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:

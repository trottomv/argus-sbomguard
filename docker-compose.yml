services:
  postgres:
    image: dhi.io/postgres:16-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/16/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: dhi.io/rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-argus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-argus}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management agent [disable_metrics_collector:true]"
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: argussbomguard:app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    container_name: argussbomguard_app
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - ./app/__init__.py:/app/__init__.py
      - ./app/main.py:/app/main.py
      - ./app/config.py:/app/config.py
      - ./app/celery_app.py:/app/celery_app.py
      - ./app/database.py:/app/database.py
      - ./app/api:/app/api
      - ./app/services:/app/services
      - ./app/models:/app/models
      - ./app/templates:/app/templates
      - ./app/tests:/app/tests
      - ./app/static/css/app.css:/app/static/css/app.css
      - ./app/protos/sbom.proto:/app/protos/sbom.proto
      - ./app/protos/__init__.py:/app/protos/__init__.py
      - ./app/migrations:/app/migrations
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: argussbomguard:app
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./app/celery_app.py:/app/celery_app.py
      - ./app/config.py:/app/config.py
      - ./app/database.py:/app/database.py
      - ./app/services:/app/services
      - ./app/models:/app/models
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: argussbomguard:app
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./app/celery_app.py:/app/celery_app.py
      - ./app/config.py:/app/config.py
    env_file:
      - .env
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:

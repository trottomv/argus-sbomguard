services:
  app:
    image: argussbomguard:${APP_ENV:-development}
    container_name: argussbomguard_app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "50051"
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: argussbomguard:${APP_ENV:-development}
    container_name: argussbomguard_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure
    user: appuser

  scheduler:
    image: argussbomguard:${APP_ENV:-development}
    container_name: argussbomguard_scheduler
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      - rabbitmq
    healthcheck:
      # Beat exposes no HTTP endpoint and does not answer `celery inspect ping`
      # (that targets workers), so the app image's healthcheck must not be
      # inherited. This is a process-existence check only: entrypoint.py execs
      # the command, making beat PID 1, so it passes while beat is alive but
      # would not catch a wedged scheduler loop. Exec form: the remote image
      # has no shell.
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure
    user: appuser

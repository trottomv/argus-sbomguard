services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    image: argussbomguard:${APP_ENV:-development}
    container_name: argussbomguard_app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "50051"
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure

  worker:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    image: argussbomguard:${APP_ENV:-development}
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure
    user: appuser

  scheduler:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    image: argussbomguard:${APP_ENV:-development}
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      - rabbitmq
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    restart: on-failure
    user: appuser
